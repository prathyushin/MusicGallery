name: MusicGallery 5.0.0 Android Release

on:
  push:
    branches: ["v5.0.0-alpha01"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MusicGallery-v5.0.0-alpha01-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicGallery-v5.0.0-alpha01
          path: MusicGallery-v5.0.0-alpha01-debug.apk
          if-no-files-found: error
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v5.0.0-alpha01 >/dev/null 2>&1; then
            gh release create v5.0.0-alpha01 \
              --title "MusicGallery 5.0.0-alpha01 — Glassmorphism & Aura" \
              --notes "V5 replaces the V4.2.1 presentation layer with the supplied Glassmorphism & Aura liquid UI while retaining real MediaStore-backed tracks, Media3 playback and the No-Dummy Policy." \
              --target v5.0.0-alpha01
          fi
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v5.0.0-alpha01 MusicGallery-v5.0.0-alpha01-debug.apk --clobber
