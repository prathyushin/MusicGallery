name: MusicGallery 5.0.0 Android Release

on:
  push:
    branches: ["v5.0.0-alpha02"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MusicGallery-v5.0.0-alpha02-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicGallery-v5.0.0-alpha02
          path: MusicGallery-v5.0.0-alpha02-debug.apk
          if-no-files-found: error
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v5.0.0-alpha02 >/dev/null 2>&1; then
            gh release create v5.0.0-alpha02 \
              --title "MusicGallery 5.0.0-alpha02 — Glassmorphism & Aura Precision" \
              --notes "V5 alpha02 hardens the Glassmorphism & Aura UI: fixed #09090B dark theme, explicit real-library ViewModel, true frosted navigation treatment, system inset handling, live Cover Flow transforms and 100dp ambient artwork blur. The No-Dummy Policy remains enforced." \
              --target v5.0.0-alpha02
          fi
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v5.0.0-alpha02 MusicGallery-v5.0.0-alpha02-debug.apk --clobber
