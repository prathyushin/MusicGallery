name: MusicGallery V3.1 Release

on:
  push:
    branches: ["release/v3.1.0-alpha01"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MusicGallery-v3.1.0-alpha01-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicGallery-v3.1.0-alpha01
          path: MusicGallery-v3.1.0-alpha01-debug.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v3.1.0-alpha01 \
            --target "${GITHUB_SHA}" \
            --title "MusicGallery v3.1.0-alpha01 — First Usable Release" \
            --prerelease \
            --notes "## MusicGallery V3.1.0-alpha01\n\nThe first genuinely usable MusicGallery release line.\n\n- Android 9 / API 28+\n- Modern Jetpack Compose + Material 3 foundation\n- Local music and Media3 playback foundation\n- Mini-player and library/search foundation\n- Podcast/RSS foundation\n- Visible version identity\n\n**Built by Pratyush.**\n\nThis is an alpha release for testing and continued development." \
            MusicGallery-v3.1.0-alpha01-debug.apk#MusicGallery-v3.1.0-alpha01-debug.apk
