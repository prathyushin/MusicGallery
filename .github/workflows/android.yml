name: Music Gallery 4.4.0 Android Release

on:
  push:
    branches: ["v4.4.0"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MusicGallery-v4.4.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicGallery-v4.4.0
          path: MusicGallery-v4.4.0-debug.apk
          if-no-files-found: error

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v4.4.0 >/dev/null 2>&1; then
            gh release create v4.4.0 \
              --title "Music Gallery 4.4.0 — Fluid Listening" \
              --notes "Music Gallery 4.4.0 is the stable V4.4 listening pass: a rebuilt artwork-first Home, reliable Media3 playback, queued commands during controller connection, persistent mini-player, full Now Playing controls, local favorites, real MediaStore content, and a consistent editorial light/dark theme. A HOXGOX Production. Built by Pranav & Prathyusha." \
              --target v4.4.0
          fi

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v4.4.0 MusicGallery-v4.4.0-debug.apk --clobber
